# Fine-tune the released DeepSeek-V4.1-Flash-1017 DSpark draft on one 8x B300 node.
#
# Differences from deepseek_v41_flash_dspark.yaml (the 16x4-GPU from-scratch recipe):
# - draft_init_from starts every trainable draft weight from the released mtp.* weights;
# - confidence_head_input: residual keeps the confidence head on the pre-norm input the released head
#   and vLLM's serving path use, so adaptive verification stays calibrated after export;
# - one node: EP 8 for the frozen 384-expert target, a fine-tuning learning rate, one epoch;
# - thinking-mode framing for regenerated code/agentic data with reasoning_content.
#
#   torchrun --standalone --nproc_per_node=8 -m nemo_automodel.recipes.llm.train_dspark \
#     -c examples/speculative/dspark/deepseek_v41_flash_1017_dspark_finetune.yaml

recipe: TrainDSparkRecipe

dist_env:
  backend: nccl
  timeout_minutes: 120

wandb:
  enable: false            # opt-in: flip to true to log this run (needs W&B credentials)
  project: deepseek-v41-dspark
  group: code-agentic-regenerated
  tags: [dspark, deepseek-v41-flash, perfectblend, hybridep]

distributed:
  strategy: fsdp2
  defer_fsdp_grad_sync: true
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  activation_checkpointing: true
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    lm_head_precision: float32
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      param_dtype: bfloat16
      reduce_dtype: float32
      output_dtype: null
      cast_forward_inputs: false

recipe_args:
  target_model_name_or_path: /data/models/DeepSeek-V4.1-Flash-1017
  draft_init_from: /data/models/DeepSeek-V4.1-Flash-1017
  confidence_head_input: residual
  # Or a local path to a downloaded V4.1-Flash checkpoint:
  train_data_path: /data/dspark/train.jsonl
  train_split: train
  val_data_path: /data/dspark/val.jsonl
  val_split: train
  output_dir: /data/outputs/dspark_v41_1017_finetune
  seq_length: 16384
  micro_batch_size: 1
  grad_accumulation_steps: 4
  num_workers: 2
  num_epochs: 1
  # Resumable: relaunching the same command restores the latest complete checkpoint (model, optimizer, LR
  # schedule, RNG) and skips the batches already trained in that epoch.
  ckpt_every_steps: 200
  save_checkpoint_every_epoch: true

  # --- chat template ---
  # The released chat_template.jinja plus {% generation %} loss spans, defaulting
  # to chat mode. For thinking-mode data (assistant turns with reasoning_content),
  # uncomment chat_template_kwargs; it also takes drop_thinking and reasoning_effort.
  chat_template: examples/llm_finetune/deepseek_v41/deepseek_v41_flash_training_chat_template.jinja
  # drop_thinking: false keeps every assistant turn's reasoning, as the template already does whenever the
  # request declares tools (the agentic case); regenerated rows hold the exact generated text (prepare.py).
  chat_template_kwargs: {thinking_mode: thinking, drop_thinking: false}

  # --- native checkpoint-owned DSpark architecture ---
  draft_num_hidden_layers: 3
  block_size: 5
  num_anchors: 512
  mask_token_id: 128799
  target_layer_ids: [37, 38, 39]
  freeze_embeddings: true
  markov_rank: 256
  markov_head_type: vanilla
  # Confidence uses the final normalized draft states. Serving a trained draft
  # must apply the same normalization before its confidence head.
  confidence_head_alpha: 1.0
  confidence_head_with_markov: true
  # Keep confidence gradients enabled to evaluate normalization on its own.
  confidence_head_stop_gradient: false

  # --- frozen DeepSeek V4.1 target backend ---
  # Use eager for a slower PyTorch numerical path when
  # the fused TileLang kernels are unavailable on the deployment.
  target_attn_backend: tilelang
  target_dispatcher: hybridep
  target_experts: torch_mm
  target_enable_fsdp_optimizations: true

  # --- objective: L = ce_alpha * L_ce + l1_alpha * L_tv + conf_alpha * L_conf ---
  ce_loss_alpha: 0.1
  l1_loss_alpha: 0.9
  loss_decay_gamma: 4.0

  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0

optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.02
  min_lr_ratio: 0.1

checkpoint:
  enabled: true
  checkpoint_dir: /data/outputs/dspark_v41_1017_finetune/checkpoints
  model_save_format: safetensors
  save_consolidated: final
  dequantize_base_checkpoint: true
  restore_from: LATEST
  # A checkpoint is ~220 GB (BF16 draft plus FP32 Adam state); keep the last two.
  max_recent_checkpoints: 2

ci:
  cluster_tag: b300
